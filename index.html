<div class="timer-container">
    <h1 class="title">제 16회 DMQ 시험 접수일까지</h1>
    
    <div class="timer-wrapper">
        <div class="time-box">
            <span class="number" id="days">00</span>
            <span class="label">일</span>
        </div>
        <div class="time-box">
            <span class="number" id="hours">00</span>
            <span class="label">시간</span>
        </div>
        <div class="time-box">
            <span class="number" id="minutes">00</span>
            <span class="label">분</span>
        </div>
        <div class="time-box">
            <span class="number" id="seconds">00</span>
            <span class="label">초</span>
        </div>
    </div>
</div>

<style>
    .timer-container *, .timer-container *:before, .timer-container *:after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    .timer-container {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        background-color: #162542;
        border-radius: 24px;
        padding: 60px 40px;
        box-shadow: 0 20px 50px rgba(19, 108, 252, 0.15);
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .timer-container .title {
        color: #FFFFFF !important;
        font-size: 2.25rem;
        font-weight: 700;
        text-align: center;
        margin-bottom: 50px;
        letter-spacing: -0.02em;
        word-break: keep-all;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .timer-container .timer-wrapper {
        display: flex;
        justify-content: space-between;
        width: 100%;
        gap: 20px;
    }

    .timer-container .time-box {
        flex: 1;
        background: linear-gradient(145deg, rgba(19, 108, 252, 0.1), rgba(22, 37, 66, 0.8));
        border: 1px solid rgba(19, 108, 252, 0.3);
        border-radius: 16px;
        padding: 30px 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .timer-container .number {
        color: #C4F84B !important;
        font-size: 4.5rem;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 12px;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 4px 12px rgba(196, 248, 75, 0.3);
    }

    .timer-container .label {
        color: #136CFC !important;
        font-size: 1.1rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }

    @media (max-width: 600px) {
        .timer-container {
            padding: 40px 20px;
        }
        .timer-container .title {
            font-size: 1.75rem;
            margin-bottom: 40px;
        }
        .timer-container .timer-wrapper {
            flex-wrap: wrap;
            gap: 15px;
        }
        .timer-container .time-box {
            flex: calc(50% - 15px);
            padding: 20px 10px;
        }
        .timer-container .number {
            font-size: 3rem;
        }
    }
</style>

<script>
    (function() {
        const targetDate = new Date("2026-11-02T00:00:00+09:00").getTime();

        function formatNumber(number) {
            return number < 10 ? '0' + number : number;
        }

        function updateTimer() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const daysEl = document.getElementById("days");
            const hoursEl = document.getElementById("hours");
            const minutesEl = document.getElementById("minutes");
            const secondsEl = document.getElementById("seconds");

            if (!daysEl || !hoursEl || !minutesEl || !secondsEl) return;

            if (distance < 0) {
                daysEl.innerText = "00";
                hoursEl.innerText = "00";
                minutesEl.innerText = "00";
                secondsEl.innerText = "00";
                if (window.timerInterval) clearInterval(window.timerInterval);
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            daysEl.innerText = formatNumber(days);
            hoursEl.innerText = formatNumber(hours);
            minutesEl.innerText = formatNumber(minutes);
            secondsEl.innerText = formatNumber(seconds);
        }

        updateTimer();
        window.timerInterval = setInterval(updateTimer, 1000);
    })();
</script>
