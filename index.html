<div class="banner-timer-container">
    <div class="text-group">
        <div class="banner-title">16회차 DMQ 알림신청 마감까지</div>
        <div class="timer-inline">
            <span id="days">00</span>일 
            <span id="hours">00</span>시간 
            <span id="minutes">00</span>분 
            <span id="seconds">00</span>초
        </div>
    </div>
    <!-- 필요시 href="#" 에 실제 이동할 링크를 넣어주세요 -->
    <a href="#" class="apply-button" target="_blank">무료 알림 신청하기 →</a>
</div>

<style>
    .banner-timer-container *, .banner-timer-container *:before, .banner-timer-container *:after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    .banner-timer-container {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        
        /* 👇 [플로팅 핵심 설정] 화면 하단에 고정되도록 추가/수정된 속성들입니다 */
        position: fixed !important;
        bottom: 25px !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
        z-index: 999999 !important;
        
        width: calc(100% - 40px);
        max-width: 600px;
        background-color: rgba(11, 19, 34, 0.95); /* 투명도 살짝 주어 세련되게 처리 */
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 16px;
        padding: 18px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .banner-timer-container .text-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .banner-timer-container .banner-title {
        color: #FFFFFF !important;
        font-size: 0.9rem;
        font-weight: 500;
        letter-spacing: -0.01em;
        word-break: keep-all;
    }

    .banner-timer-container .timer-inline {
        color: #C4F84B !important; /* 라임색 */
        font-size: 1.3rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0 10px rgba(196, 248, 75, 0.2);
        white-space: nowrap;
    }

    .banner-timer-container .apply-button {
        background-color: #C4F84B !important;
        color: #0b1322 !important;
        font-size: 0.85rem;
        font-weight: 700;
        padding: 12px 18px;
        border-radius: 9999px;
        text-decoration: none;
        white-space: nowrap;
        transition: transform 0.2s ease, opacity 0.2s ease;
        box-shadow: 0 4px 12px rgba(196, 248, 75, 0.2);
    }

    .banner-timer-container .apply-button:hover {
        opacity: 0.9;
        transform: translateY(-2px);
    }

    /* 모바일 환경 대응 (폭이 좁아지면 세로로 배치) */
    @media (max-width: 520px) {
        .banner-timer-container {
            bottom: 15px !important;
            width: calc(100% - 20px) !important;
            flex-direction: column;
            align-items: stretch;
            padding: 16px;
            text-align: center;
        }
        .banner-timer-container .text-group {
            align-items: center;
        }
        .banner-timer-container .timer-inline {
            font-size: 1.15rem;
        }
        .banner-timer-container .apply-button {
            text-align: center;
            width: 100%;
            margin-top: 5px;
        }
    }
</style>

<script>
    (function() {
        const targetDate = new Date("2026-11-02T00:00:00+09:00").getTime();

        function formatNumber(number) {
            return number < 10 ? '0' + number : number;
        }

        function updateTimer() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const daysEl = document.getElementById("days");
            const hoursEl = document.getElementById("hours");
            const minutesEl = document.getElementById("minutes");
            const secondsEl = document.getElementById("seconds");

            if (!daysEl || !hoursEl || !minutesEl || !secondsEl) return;

            if (distance < 0) {
                daysEl.innerText = "00";
                hoursEl.innerText = "00";
                minutesEl.innerText = "00";
                secondsEl.innerText = "00";
                if (window.timerInterval) clearInterval(window.timerInterval);
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            daysEl.innerText = formatNumber(days);
            hoursEl.innerText = formatNumber(hours);
            minutesEl.innerText = formatNumber(minutes);
            secondsEl.innerText = formatNumber(seconds);
        }

        updateTimer();
        window.timerInterval = setInterval(updateTimer, 1000);
    })();
</script>
