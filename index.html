<div class="floating-timer-container">
    <div class="content-wrapper">
        <div class="text-group">
            <div class="banner-title">16회차 DMQ 알림신청 마감까지</div>
            <div class="timer-inline">
                <span id="days">00</span>일 
                <span id="hours">00</span>시간 
                <span id="minutes">00</span>분 
                <span id="seconds">00</span>초
            </div>
        </div>
        <!-- 원하는 이동 링크로 수정하세요 -->
        <a href="https://your-target-link.com" class="apply-button" target="_blank">무료 알림 신청하기 →</a>
    </div>
</div>

<style>
    .floating-timer-container *, .floating-timer-container *:before, .floating-timer-container *:after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    /* 플로팅 핵심 스타일 */
    .floating-timer-container {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        position: fixed; /* 화면에 고정 */
        bottom: 20px;    /* 화면 아래에서 20px 위 */
        left: 50%;       /* 화면 가운데 정렬 */
        transform: translateX(-50%);
        width: calc(100% - 40px);
        max-width: 600px;
        z-index: 999999; /* 다른 요소들 위에 보이도록 설정 */
        background-color: rgba(11, 19, 34, 0.95); /* 배경색 (살짝 투명한 남색) */
        backdrop-filter: blur(10px); /* 배경 블러 효과 */
        border: 1px solid rgba(196, 248, 75, 0.3); /* 라임색 테두리 포인트 */
        border-radius: 16px;
        padding: 16px 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .floating-timer-container .content-wrapper {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        width: 100%;
    }

    .floating-timer-container .text-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .floating-timer-container .banner-title {
        color: #FFFFFF !important;
        font-size: 0.85rem;
        font-weight: 500;
        letter-spacing: -0.01em;
        word-break: keep-all;
    }

    .floating-timer-container .timer-inline {
        color: #C4F84B !important; /* 라임색 */
        font-size: 1.2rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0 10px rgba(196, 248, 75, 0.2);
        white-space: nowrap;
    }

    .floating-timer-container .apply-button {
        background-color: #C4F84B !important;
        color: #0b1322 !important;
        font-size: 0.85rem;
        font-weight: 700;
        padding: 12px 18px;
        border-radius: 9999px;
        text-decoration: none;
        white-space: nowrap;
        transition: transform 0.2s ease, opacity 0.2s ease;
        box-shadow: 0 4px 12px rgba(196, 248, 75, 0.2);
    }

    .floating-timer-container .apply-button:hover {
        opacity: 0.9;
        transform: translateY(-2px);
    }

    /* 모바일 환경 대응 */
    @media (max-width: 520px) {
        .floating-timer-container {
            bottom: 10px;
            width: calc(100% - 20px);
            padding: 14px 16px;
        }
        .floating-timer-container .content-wrapper {
            flex-direction: column;
            align-items: stretch;
            text-align: center;
        }
        .floating-timer-container .text-group {
            align-items: center;
        }
        .floating-timer-container .timer-inline {
            font-size: 1.1rem;
        }
        .floating-timer-container .apply-button {
            text-align: center;
            width: 100%;
            margin-top: 4px;
        }
    }
</style>

<script>
    (function() {
        const targetDate = new Date("2026-11-02T00:00:00+09:00").getTime();

        function formatNumber(number) {
            return number < 10 ? '0' + number : number;
        }

        function updateTimer() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const daysEl = document.getElementById("days");
            const hoursEl = document.getElementById("hours");
            const minutesEl = document.getElementById("minutes");
            const secondsEl = document.getElementById("seconds");

            if (!daysEl || !hoursEl || !minutesEl || !secondsEl) return;

            if (distance < 0) {
                daysEl.innerText = "00";
                hoursEl.innerText = "00";
                minutesEl.innerText = "00";
                secondsEl.innerText = "00";
                if (window.timerInterval) clearInterval(window.timerInterval);
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            daysEl.innerText = formatNumber(days);
            hoursEl.innerText = formatNumber(hours);
            minutesEl.innerText = formatNumber(minutes);
            secondsEl.innerText = formatNumber(seconds);
        }

        updateTimer();
        window.timerInterval = setInterval(updateTimer, 1000);
    })();
</script>
