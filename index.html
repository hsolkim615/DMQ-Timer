<div class="banner-timer-container">
    <div class="text-group">
        <div class="banner-title">16회차 DMQ 알림신청 마감까지</div>
        <div class="timer-inline">
            <span id="days">00</span>일 
            <span id="hours">00</span>시간 
            <span id="minutes">00</span>분 
            <span id="seconds">00</span>초
        </div>
    </div>
</div>

<style>
    html,
    body {
        width: 100%;
        max-width: 100%;
        margin: 0;
        overflow-x: hidden;
        box-sizing: border-box;
    }
    .banner-timer-container *,
    .banner-timer-container *::before,
    .banner-timer-container *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    .banner-timer-container {
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        width: min(100%, 600px);
        max-width: 100%;
        min-width: 0;
        margin: 0 auto;
        background-color: #0b1322;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 18px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        text-align: left;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .banner-timer-container .text-group {
        min-width: 0;
        max-width: 100%;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        text-align: left;
    }

    .banner-timer-container .banner-title {
        color: #FFFFFF !important;
        font-size: 0.9rem;
        font-weight: 500;
        letter-spacing: -0.01em;
        word-break: keep-all;
        text-align: left !important;
    }

    .banner-timer-container .timer-inline {
        color: #C4F84B !important;
        font-size: 1.3rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0 10px rgba(196, 248, 75, 0.2);
        white-space: nowrap;
        text-align: left !important;
    }

    @media (max-width: 520px) {
        .banner-timer-container {
        box-sizing: border-box;
            flex-direction: column;
            align-items: stretch;
            padding: 18px;
            text-align: left !important;
        }

        .banner-timer-container .text-group {
            align-items: flex-start !important;
            width: 100% !important;
            text-align: left !important;
        }

        .banner-timer-container .banner-title,
        .banner-timer-container .timer-inline {
            text-align: left !important;
        }

        .banner-timer-container .timer-inline {
            font-size: 1.15rem;
        }
    }
</style>

<script>
    (function() {
        const targetDate = new Date("2026-11-02T00:00:00+09:00").getTime();

        function formatNumber(number) {
            return number < 10 ? '0' + number : number;
        }

        function updateTimer() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const daysEl = document.getElementById("days");
            const hoursEl = document.getElementById("hours");
            const minutesEl = document.getElementById("minutes");
            const secondsEl = document.getElementById("seconds");

            if (!daysEl || !hoursEl || !minutesEl || !secondsEl) return;

            if (distance < 0) {
                daysEl.innerText = "00";
                hoursEl.innerText = "00";
                minutesEl.innerText = "00";
                secondsEl.innerText = "00";
                if (window.timerInterval) clearInterval(window.timerInterval);
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            daysEl.innerText = formatNumber(days);
            hoursEl.innerText = formatNumber(hours);
            minutesEl.innerText = formatNumber(minutes);
            secondsEl.innerText = formatNumber(seconds);
        }

        updateTimer();
        window.timerInterval = setInterval(updateTimer, 1000);
    })();
</script>
